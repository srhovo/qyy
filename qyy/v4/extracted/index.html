<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>见字如面</title>
<style>
:root{
  --ink:#0a0a0b;
  --ink2:#141416;
  --ash:#8b8d92;
  --ash2:#4a4c52;
  --mist:#e8e9ec;
  --paper:#f4f2ef;
  --red:#c8322b;
  --red-soft:#e05a50;
  --ease:cubic-bezier(.4,0,.2,1);
  /* 圆润一点的字体栈：优先系统圆体/手写感，逐级回退 */
  --round:"PingFang SC","Hiragino Sans GB","Yuanti SC","Yuanti TC","STYuanti",
          "Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",
          "Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --round-serif:"Yuanti SC","Hiragino Maru Gothic ProN",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{
  font-family:var(--round);
  color:var(--mist);
  -webkit-font-smoothing:antialiased;
  font-weight:400;
  letter-spacing:.04em;
}
#stage{position:fixed;inset:0;overflow:hidden}

/* ============ 场景通用 ============ */
.scene{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity 1.6s var(--ease),visibility 1.6s var(--ease);
  will-change:opacity;
}
.scene.on{opacity:1;visibility:visible}
.scene.out{opacity:0;visibility:hidden}

/* canvas 层（雨/茉莉/粒子） */
.cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ============ 开场：黑场一滴水 ============ */
#s0{background:#000}
#s0 .ripple{
  position:absolute;left:50%;top:50%;
  width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;
  border:1px solid rgba(232,233,236,.75);
  animation:ripple 3s var(--ease) forwards;
}
@keyframes ripple{
  0%{transform:scale(1);opacity:0}
  10%{opacity:.9}
  100%{transform:scale(48);opacity:0}
}
#s0 .drop{
  position:absolute;left:50%;top:-10%;width:2px;height:14px;
  margin-left:-1px;border-radius:2px;
  background:linear-gradient(180deg,transparent,rgba(232,233,236,.9));
  animation:drop 1.1s cubic-bezier(.55,0,1,.45) forwards;
}
@keyframes drop{to{top:50%;opacity:0}}

/* 涟漪里浮现的开场诗 */
#s0 .poem{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(15px,3.7vw,20px);
  letter-spacing:.46em;text-indent:.46em;
  color:rgba(240,241,244,.95);
  white-space:nowrap;
  opacity:0;
  filter:blur(8px);
  font-weight:400;
  transition:opacity 2.4s var(--ease),filter 2.4s var(--ease),letter-spacing 2.4s var(--ease);
}
#s0.poem-on .poem{
  opacity:1;filter:blur(0);
}
#s0.poem-breathe .poem{
  letter-spacing:.46em;
}
#s0 .poem .rain-dot{
  display:inline-block;
  color:var(--red-soft);
  margin-left:.2em;
  animation:rainPulse 2.4s ease-in-out infinite;
  animation-delay:5.6s;   /* 诗完全浮现后开始 */
}
@keyframes rainPulse{
  0%,100%{opacity:.3;transform:scale(1)}
  50%{opacity:1;transform:scale(1.25)}
}

#s0 .hint{
  position:absolute;bottom:8%;left:0;right:0;text-align:center;
  font-size:12px;letter-spacing:.5em;color:rgba(232,233,236,.45);
  animation:breathe 3.4s ease-in-out infinite;
  text-indent:.5em;
}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.75}}

/* ============ 文本排版 ============ */
.cap{
  position:relative;z-index:5;text-align:center;
  padding:0 1.4rem;max-width:min(760px,92vw);
}
.cap .zh{
  font-size:clamp(19px,4.4vw,32px);
  line-height:2.0;font-weight:400;letter-spacing:.1em;
  color:var(--mist);text-indent:.1em;
}
.cap .zh.sm{
  font-size:clamp(14.5px,3.1vw,21px);
  line-height:2.25;color:#b9bbc2;
  font-weight:400;
}
.cap .zh.xs{font-size:clamp(12.5px,2.6vw,16px);line-height:2.35;color:var(--ash2);font-weight:400}
.cap .en{
  font-size:clamp(10px,2vw,12px);letter-spacing:.34em;color:var(--ash2);
  margin-top:1.5rem;text-transform:uppercase;text-indent:.34em;
}
.cap .line{display:block;overflow:hidden;padding:.06em 0}
.cap .line i{display:block;font-style:normal;transform:translateY(105%);opacity:0;
  transition:transform 1.5s var(--ease),opacity 1.5s var(--ease)}
.scene.on .cap .line i{transform:translateY(0);opacity:1}

/* 红色强调 */
.red{color:var(--red-soft)}
.dot-red{color:var(--red);font-style:normal}

/* ============ 来电场景 ============ */
#s2{background:radial-gradient(ellipse at 50% 42%,#17181b 0%,#0a0a0b 62%)}
.call-wrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.call-avatars{
  display:flex;align-items:center;justify-content:center;gap:clamp(28px,8vw,46px);
  position:relative;
}
.av{
  width:clamp(96px,22vw,140px);height:clamp(96px,22vw,140px);
  border-radius:50%;overflow:hidden;position:relative;z-index:2;
  background:#1c1d20;
  box-shadow:0 0 0 1px rgba(232,233,236,.16), 0 18px 44px rgba(0,0,0,.6);
  transition:transform 1s var(--ease);
}
.av picture{display:block;width:100%;height:100%}
.av img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.02)}
.av.caller{box-shadow:0 0 0 1px rgba(232,233,236,.16),0 0 34px rgba(200,50,43,.20),0 18px 44px rgba(0,0,0,.6)}
.av.ring::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(200,50,43,.55);
  animation:ring 2.2s ease-out infinite;
}
@keyframes ring{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.35);opacity:0}}

/* 接通后：两头像之间的红线 */
.call-link{
  position:absolute;left:50%;top:50%;
  width:clamp(60px,18vw,120px);height:1px;
  transform:translate(-50%,-50%) scaleX(0);
  transform-origin:center;
  background:linear-gradient(90deg,transparent, rgba(200,50,43,.85), transparent);
  transition:transform 1.4s var(--ease);
  z-index:1;
}
.call-link.on{transform:translate(-50%,-50%) scaleX(1)}

.call-txt{margin-top:2.2rem;text-align:center}
.call-txt .who{
  font-size:clamp(21px,5vw,29px);font-weight:400;letter-spacing:.16em;
  color:var(--mist);text-indent:.16em;
}
.call-txt .status{
  margin-top:.9rem;font-size:clamp(12px,2.6vw,14.5px);letter-spacing:.26em;
  color:var(--ash);text-indent:.26em;
  min-height:1.6em;
  transition:color .4s var(--ease);
}
.call-txt .status.wait{color:var(--red-soft)}
.call-txt .status.connected{color:rgba(232,233,236,.95)}

/* 计时器 */
.call-timer{
  margin-top:.6rem;
  font-size:clamp(11.5px,2.5vw,13.5px);
  letter-spacing:.3em;text-indent:.3em;
  color:rgba(139,141,146,.65);
  font-variant-numeric:tabular-nums;
  opacity:0;
  transition:opacity .8s var(--ease);
}
.call-timer.on{opacity:1}

/* 三个跳动的点（替代柱状波） */
.dots{
  display:flex;gap:10px;justify-content:center;margin-top:1.8rem;height:20px;align-items:center;
}
.dots span{
  width:5px;height:5px;border-radius:50%;
  background:var(--ash2);
  animation:dotB 1.4s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.22s}
.dots span:nth-child(3){animation-delay:.44s}
@keyframes dotB{
  0%,60%,100%{transform:translateY(0);opacity:.45}
  30%{transform:translateY(-7px);opacity:1;background:rgba(232,233,236,.9)}
}

/* ============ 色彩场景 ============ */
#s3{background:#0a0a0b}
#s3 .cap{
  display:flex;flex-direction:column;align-items:center;
  padding:0 1.4rem;
  max-width:100%;
}
/* S3 三行文字：左对齐但整体居中，避免"参差右偏"的视觉错觉 */
#s3 .cap .zh.sm{
  text-align:left;
}
#s3 .cap .zh.sm .line i{
  text-indent:0;
}
.swatches{
  position:relative;z-index:5;
  display:flex;gap:clamp(10px,2.6vw,20px);
  margin-top:clamp(2.4rem,6.5vh,4rem);
  align-items:flex-end;
  justify-content:center;
}
.sw{
  width:clamp(40px,10vw,64px);height:clamp(80px,17vw,120px);
  opacity:0;transform:translateY(30px) scaleY(.7);
  transition:opacity 1.2s var(--ease),transform 1.2s var(--ease),box-shadow 1.2s var(--ease);
  position:relative;
}
.scene.on .sw{opacity:1;transform:none}

/* 每块都是"撕开的纸" —— 用 clip-path 做斜切 */
.sw:nth-child(1){
  background:#0d0d0f;
  box-shadow:inset 0 0 0 1px rgba(232,233,236,.18), 0 4px 12px rgba(0,0,0,.5);
  clip-path:polygon(4% 0, 100% 2%, 96% 100%, 0 98%);
}
.sw:nth-child(2){
  background:linear-gradient(180deg,#565860 0%,#4a4c52 100%);
  clip-path:polygon(0 3%, 96% 0, 100% 97%, 4% 100%);
}
.sw:nth-child(3){
  background:linear-gradient(180deg,#f0f1f3 0%,#e8e9ec 100%);
  clip-path:polygon(2% 0, 100% 4%, 98% 100%, 0 96%);
}

/* 红色块：心跳形状（不是矩形，是一个会呼吸的圆角水滴） */
.sw.beat{
  background:radial-gradient(circle at 32% 28%, #e05850, #a02420 78%);
  clip-path:polygon(50% 0%, 96% 4%, 100% 50%, 96% 96%, 50% 100%, 4% 96%, 0 50%, 4% 4%);
  border-radius:14%;
  box-shadow:0 0 32px rgba(200,50,43,.4);
}
.scene.on .sw.beat{animation:beat 1.6s ease-in-out 1s infinite}
@keyframes beat{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 22px rgba(200,50,43,.35);
    filter:brightness(.96);
  }
  30%{
    transform:scale(1.10);
    box-shadow:0 0 56px rgba(220,68,58,.85), 0 0 90px rgba(200,50,43,.4);
    filter:brightness(1.10);
  }
  42%{
    transform:scale(1.04);
    box-shadow:0 0 34px rgba(200,50,43,.55);
    filter:brightness(1.0);
  }
  55%{
    transform:scale(1.13);
    box-shadow:0 0 64px rgba(230,80,68,.95), 0 0 110px rgba(200,50,43,.45);
    filter:brightness(1.14);
  }
}

/* ============ 信（信纸） ============ */
#s4{background:#0a0a0b;display:block}
.letter-scroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:clamp(50px,10vh,100px) clamp(20px,4vw,44px) clamp(130px,20vh,200px);
  scrollbar-width:none;
}
.letter-scroll::-webkit-scrollbar{display:none}

/* 信纸 + 双层叠边（第二页露一点） */
.letter-stack{
  position:relative;
  max-width:min(520px,100%);
  margin:0 auto;
}
.letter-stack::before{
  content:"";position:absolute;
  top:6px;left:8px;right:8px;bottom:-5px;
  background:linear-gradient(174deg,#e9e6e1 0%,#e2dfd9 100%);
  border-radius:2px;
  transform:rotate(.6deg);
  z-index:0;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.letter{
  max-width:100%;margin:0 auto;position:relative;z-index:1;
  color:#1f1e1c;
  background:
    radial-gradient(ellipse at 18% 6%, rgba(200,50,43,.05), transparent 58%),
    radial-gradient(ellipse at 84% 88%, rgba(74,76,82,.06), transparent 62%),
    linear-gradient(174deg,#f7f5f2 0%,#f0eeeb 48%,#f3f1ee 100%);
  padding:clamp(36px,6vw,58px) clamp(22px,4.6vw,44px);
  border-radius:2px;
  box-shadow:0 30px 90px rgba(0,0,0,.62), 0 2px 6px rgba(0,0,0,.15), 0 0 0 1px rgba(255,255,255,.06);
  opacity:0;transform:translateY(34px);
  transition:opacity 2s var(--ease),transform 2.2s var(--ease);
  overflow-wrap:break-word;
  word-break:break-word;
}
.scene.on .letter{opacity:1;transform:none}
/* 信纸纹理：横向细纹 */
.letter::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background-image:repeating-linear-gradient(0deg,rgba(31,30,28,.018) 0 1px,transparent 1px 32px);
  mix-blend-mode:multiply;
}
.letter p{
  position:relative;font-size:clamp(15px,3.5vw,17.5px);
  line-height:2.3;color:#1f1e1c;letter-spacing:.04em;
  margin-bottom:1.7em;font-weight:400;
  opacity:0;transform:translateY(14px);
  transition:opacity 1.5s var(--ease),transform 1.5s var(--ease);
}
.letter p.show{opacity:1;transform:none}
.letter p.first{
  font-size:clamp(22px,5.6vw,32px);font-weight:300;letter-spacing:.34em;
  color:#111;margin-bottom:1.4em;text-indent:.34em;line-height:1.8;
}

/* 落款：加手绘下划线 */
.letter p.sig{
  text-align:right;margin-bottom:0;margin-top:2.8em;letter-spacing:.12em;
  position:relative;
}
.letter p.sig .nm{
  font-size:1.32em;font-weight:500;letter-spacing:.18em;
  position:relative;display:inline-block;
}
.letter p.sig .nm::after{
  content:"";position:absolute;
  left:-4%;right:-6%;bottom:-6px;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(200,50,43,.6) 20%, rgba(200,50,43,.85) 60%, transparent);
  border-radius:1px;
  transform:rotate(-.4deg);
}

.letter .sign-mark{
  display:block;text-align:right;margin-top:1em;
}

/* 真实印泥质感印章：朱红+做旧 */
.seal{
  display:inline-block;width:58px;height:58px;position:relative;
  color:rgba(200,50,43,.92);font-size:16px;line-height:1.16;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  letter-spacing:.06em;font-weight:600;
  padding:6px;box-sizing:border-box;text-align:center;
  transform:rotate(-6deg) scale(.5);opacity:0;
  transition:transform 1.1s cubic-bezier(.34,1.56,.64,1),opacity .9s ease;
  /* 印泥质感的多层叠加 */
  background:
    radial-gradient(circle at 28% 32%, rgba(220,80,68,.15), transparent 60%),
    radial-gradient(circle at 72% 70%, rgba(160,30,24,.10), transparent 55%);
  border-radius:4px;
  box-shadow:
    inset 0 0 0 1.5px rgba(200,50,43,.75),
    inset 0 0 12px rgba(200,50,43,.15);
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
}
.seal.show{transform:rotate(-6deg) scale(1);opacity:1}
.seal::before{
  content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
  /* 印泥的不均匀 */
  background:
    radial-gradient(circle at 18% 22%, transparent 30%, rgba(200,50,43,.18) 55%, transparent 75%),
    radial-gradient(circle at 82% 78%, transparent 25%, rgba(160,32,26,.22) 50%, transparent 70%);
  mix-blend-mode:multiply;
}
.seal::after{
  content:"";position:absolute;inset:-2px;border-radius:4px;pointer-events:none;
  border:1px solid rgba(200,50,43,.5);
  filter:blur(.4px);
}
.seal span{display:block;width:50%;text-align:center;text-shadow:0 0 1px rgba(200,50,43,.4)}
/* 高亮 */
.letter em.hl{
  font-style:normal;color:var(--red);font-weight:500;
}

/* ============ 蛋糕 ============ */
#s5{background:radial-gradient(ellipse at 50% 58%,#1a1416 0%,#08080a 66%)}
.cake-wrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;
  transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.cake-wrap.fadeout{opacity:0;transform:scale(.94) translateY(10px);pointer-events:none}
.cake-svg{width:clamp(240px,62vw,420px);height:auto;overflow:visible}
/* 火焰 */
.flame{
  transform-origin:center bottom;
  animation:flameSway 1.6s ease-in-out infinite;
  transition:opacity .7s ease, transform .7s ease;
}
@keyframes flameSway{
  0%,100%{transform:scale(1) rotate(-1.6deg)}
  35%{transform:scale(1.07,.96) rotate(1.8deg) translateX(.8px)}
  70%{transform:scale(.95,1.06) rotate(-1deg)}
}
.flame.gone{opacity:0;transform:scale(.25) translateY(-8px)}
.halo{transition:opacity .8s ease}
.halo.gone{opacity:0}

/* 火焰上方的"19"：若隐若现，像被火光映出来 */
.age-glow{
  animation:ageGlowPulse 4.8s ease-in-out infinite;
  transition:opacity .9s ease;
  transform-origin:center;
}
.age-glow.on{opacity:1 !important}
.age-glow.gone{opacity:0 !important;animation:none}
@keyframes ageGlowPulse{
  0%,100%{opacity:0}
  50%{opacity:.8}
}

/* 烟雾"19"：吹灭后短暂浮现再散开 */
.age-smoke{
  transition:opacity 1.2s ease, transform 2s ease;
  transform-origin:center;
}
.age-smoke.on{
  opacity:1 !important;
  animation:ageSmokeUp 4.6s ease-out forwards;
}
@keyframes ageSmokeUp{
  0%{opacity:0;transform:translateY(0) scale(.9);filter:blur(0)}
  25%{opacity:.95;transform:translateY(-8px) scale(1)}
  70%{opacity:.7;transform:translateY(-22px) scale(1.06);filter:blur(.6px)}
  100%{opacity:0;transform:translateY(-42px) scale(1.16);filter:blur(2px)}
}

/* 烟 */
.smoke{
  opacity:0;transition:opacity .4s;
}
.smoke.go{opacity:1;animation:smokeUp 5s ease-out forwards}
@keyframes smokeUp{
  0%{opacity:0;transform:translateY(0) scale(.5)}
  22%{opacity:.55}
  100%{opacity:0;transform:translateY(-46px) scale(1.7)}
}
/* 提示 */
.blow-tip{
  margin-top:2rem;text-align:center;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;
}
.blow-tip .t1{
  font-size:clamp(13.5px,3.1vw,18px);letter-spacing:.18em;color:var(--mist);
  text-indent:.18em;font-weight:400;
}
.blow-tip .t2{
  font-size:clamp(10.5px,2.4vw,12.5px);letter-spacing:.16em;color:#7d7f86;
  text-indent:.16em;min-height:1.2em;
}
.ripples{display:flex;gap:6px;align-items:center;height:26px}
.ripples i{
  width:2px;background:linear-gradient(180deg,rgba(232,233,236,.85),rgba(232,233,236,.15));
  border-radius:2px;height:5px;opacity:.35;
  transition:height .12s linear,opacity .12s linear;
}
/* 吹气进度环 */
.breath-bar{
  width:min(190px,48vw);height:2px;background:rgba(232,233,236,.14);
  border-radius:2px;overflow:hidden;margin-top:.4rem;
}
.breath-bar i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--ash),var(--red-soft));
  transition:width .16s linear;
}
/* 祝福词 —— 吹灭后独占一屏（蛋糕淡出） */
.wish{
  position:absolute;inset:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
  padding:0 1.4rem;text-align:center;
  background:radial-gradient(ellipse at 50% 46%, rgba(26,20,22,.92) 0%, rgba(8,8,10,.97) 62%);
  pointer-events:none;opacity:0;transition:opacity 1.6s var(--ease);
}
.wish.on{opacity:1;pointer-events:auto}

/* 第一行：名字 */
.wish-name{
  font-size:clamp(34px,9vw,58px);
  font-weight:500;
  letter-spacing:.1em;text-indent:.1em;
  line-height:1.3;
  color:var(--mist);
  text-shadow:0 0 30px rgba(232,233,236,.25);
}

/* 第二行：十九 + 岁 + 生日快乐 */
.wish-age{
  margin-top:clamp(.7rem,2.2vh,1.2rem);
  display:flex;align-items:baseline;justify-content:center;
  flex-wrap:wrap;
  gap:0;
  line-height:1.35;
}
.wish-age .num{
  font-size:clamp(30px,8vw,52px);
  font-weight:500;
  letter-spacing:.04em;
  color:var(--red-soft);
  text-shadow:0 0 34px rgba(224,90,80,.45);
}
.wish-age .unit{
  font-size:clamp(19px,5vw,32px);
  font-weight:400;
  letter-spacing:.06em;
  color:var(--red-soft);
  margin-left:.1em;
  opacity:.9;
}
.wish-age .bday{
  font-size:clamp(21px,5.6vw,37px);
  font-weight:400;
  letter-spacing:.1em;
  color:var(--mist);

<script>
/* =========================================================
   全局
   ========================================================= */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SCENES = ['s0','s1','s2','s3','s4','s5'];
let cur = -1;
let stageTimer = null;
const bgm = document.getElementById('bgm');
const bell = document.getElementById('bell');
let muted = false;

const $ = id => document.getElementById(id);

/* ---------- 场景切换 ---------- */
function go(i){
  if(i<0 || i>=SCENES.length) return;
  if(i === cur) return;
  clearTimeout(stageTimer);
  const prev = cur >= 0 ? $(SCENES[cur]) : null;
  if(prev){ prev.classList.remove('on'); prev.classList.add('out'); }
  cur = i;
  const el = $(SCENES[i]);
  el.classList.remove('out');
  el.classList.add('on');
  renderPgs();
  // 离开来电幕时，兜底停掉铃声（防止跳幕时铃声残留）
  if(i !== 2 && bell && !bell.paused) bellStop(700);
  onEnter(i);
}
function nextScene(){ go(cur+1); }

/* ---------- 进度点 ---------- */
const pgs = $('pgs');
SCENES.forEach((_,i)=>{
  const d = document.createElement('i');
  d.onclick = ()=> go(i);
  pgs.appendChild(d);
});
function renderPgs(){
  [...pgs.children].forEach((d,i)=>{
    d.classList.toggle('cur', i===cur);
    d.style.display = (i>=4 && i!==cur) ? 'none' : ''; // 信/蛋糕不重复显示
  });
  pgs.classList.toggle('on', cur>=0 && cur<=3);
  $('hud').classList.toggle('on', cur>=1);
  $('skip').classList.toggle('on', cur>=0 && cur<=3);
  $('next').classList.toggle('on', cur>=1 && cur<=3);
}

/* ---------- 音频控制 ----------
   iOS Safari 要求音频必须在"用户手势的同步调用栈"里首次播放，
   否则后续 play() 会被静默拒绝。unlockAudio() 必须在 click 里同步调用。

   两条音轨：
     bgm   —— 《特别的人》，从页面打开到结束**连续播放**的背景底乐，
              只在「微信来电」和「吹蜡烛」两种时刻暂停，
              离开这两个时刻后**从暂停处接着播**（绝不回到开头）。
     bell  —— 《好想爱这个世界啊》铃声，只在来电段响。

   设计要点（这是本模块的全部复杂度所在）：
     1. bgm 永不 seek、永不重设 src —— 只 play()/pause()。
        暂停天然保留 currentTime，恢复时自然接着播。
     2. 音量淡入淡出承担"接续"的听感：暂停前淡出、恢复时淡入，
        但 currentTime 始终连续。
     3. 所有音量渐变都用 rAF + setInterval 双驱动 ——
        后台标签页/省电模式会冻结 rAF，只用 rAF 会让音量卡在 0。
*/
let audioUnlocked = false;

const TEBIE = 'assets/audio/tebie_intro.mp3';
const BELL  = 'assets/audio/bell_intro.mp3';

/* 底乐的目标音量（0~1）。静音时对外表现为 0。 */
const BGM_VOL = .85;
const BELL_VOL = .90;

/* 底乐"应该处于播放态"还是"应该暂停"——这是唯一的意图来源。
   场景切换只改这个意图，再由 syncBgm() 去执行。 */
let bgmIntent = 'idle';   // 'idle' | 'play' | 'pause'

/* 预加载：给两个 audio 元素早早设上 src 并触发 load，
   避免首次 play() 时还没数据（readyState=0 会静默播不出声音）。
   注意给 bgm 打上 loop —— 单曲循环，曲终自动接上。 */
(function preloadAudio(){
  const items = [[bgm, TEBIE], [bell, BELL]];
  for(const [el, src] of items){
    try{
      el.preload = 'auto';
      el.loop = true;
      if(el.getAttribute('src') !== src) el.setAttribute('src', src);
      el.load();
    }catch(e){}
  }
})();

function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  // 静音起播一下，骗过 iOS/Chrome 的"必须用户手势"限制。
  // 关键：这段"解锁试探"绝不能打断真正的播放 ——
  // 用 _unlocking 标志隔离，一旦真实播放接管（_playing=true），立刻放弃回退。
  [bgm, bell].forEach(el=>{
    try{
      if(!el.getAttribute('src')) return;
      el._unlocking = true;
      el.muted = true;          // 静音解锁，不发声
      el.volume = 0;            // 音量归零，避免回退前满音量残留
      const fin = ()=>{
        el._unlocking = false;
        if(el._playing) return;        // 已被真实播放接管 → 什么都不做
        try{ el.pause(); }catch(e){}
        try{ el.currentTime = 0; }catch(e){}
        el.volume = 0;
        el.muted = false;
      };
      const p = el.play();
      if(p && p.then) p.then(fin).catch(fin);
      else fin();
    }catch(e){ el._unlocking = false; el.muted = false; }
  });
  // 同时解锁 WebAudio（吹气用）
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ const a = new AC(); a.resume && a.resume(); a.close && a.close(); }
  }catch(e){}
}

/* 通用淡入淡出：对任意 audio 元素
   注意：不能只靠 requestAnimationFrame —— 后台标签页/省电模式下 rAF 会被节流
   甚至完全暂停，导致音量卡在 0（表现为"在播但没声音"）。
   这里用 rAF + setInterval 双保险，谁先跑到终点算谁。 */
function fadeEl(el, target, dur, onEnd){
  cancelAnimationFrame(el._fadeRAF);
  clearInterval(el._fadeTICK);
  target = Math.max(0, Math.min(1, target));
  const t0 = performance.now(), v0 = el.volume;
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    cancelAnimationFrame(el._fadeRAF);
    clearInterval(el._fadeTICK);
    el.volume = target;
    if(onEnd) onEnd();
  };
  const step = (now)=>{
    const k = Math.min(1, (now - t0) / dur);
    el.volume = Math.max(0, Math.min(1, v0 + (target - v0) * k));
    if(k >= 1) finish();
  };
  if(dur <= 0){ finish(); return; }
  el._fadeRAF = requestAnimationFrame(function loop(t){
    step(t);
    if(!done) el._fadeRAF = requestAnimationFrame(loop);
  });
  // 双保险：rAF 被冻结时由 setInterval 兜底推进
  el._fadeTICK = setInterval(()=> step(performance.now()), 50);
}

/* 等待音频可播（readyState 足够）后再执行 cb，带超时兜底 */
function whenReady(el, cb, timeoutMs=5000){
  if(el.readyState >= 2){ cb(); return; }      // HAVE_CURRENT_DATA 以上
  let fired = false;
  const go = ()=>{ if(fired) return; fired = true; cleanup(); cb(); };
  const cleanup = ()=>{
    el.removeEventListener('canplay', go);
    el.removeEventListener('loadeddata', go);
    el.removeEventListener('error', go);
    clearTimeout(el._readyTimer);
  };
  el.addEventListener('canplay', go, {once:true});
  el.addEventListener('loadeddata', go, {once:true});
  el.addEventListener('error', go, {once:true});
  el._readyTimer = setTimeout(go, timeoutMs);
  try{ if(el.readyState === 0) el.load(); }catch(e){}
}

/* 真正让某条音轨出声：保持当前 currentTime，淡入到目标音量。
   绝不 seek —— 这是"接续播放"的关键。 */
function startEl(el, vol, fadeIn){
  el._playing = true;
  el._unlocking = false;
  el.muted = false;
  const target = muted ? 0 : vol;
  el._targetVol = target;

  const begin = ()=>{
    el.loop = true;
    el._targetVol = muted ? 0 : vol;
    // 已在播：只把音量淡到目标，不碰 currentTime
    if(!el.paused){
      if(Math.abs(el.volume - el._targetVol) > .005) fadeEl(el, el._targetVol, fadeIn);
      else el.volume = el._targetVol;
      return;
    }
    const from = el.volume;               // 从当前音量平滑淡入
    const p = el.play();
    if(p && p.catch){
      p.catch(()=>{
        // 被拒（多半是未解锁）→ 等下一次用户交互后重试
        const retry = ()=>{
          document.removeEventListener('click', retry);
          document.removeEventListener('touchstart', retry);
          if(el._playing && el.paused){
            const rp = el.play();
            if(rp && rp.catch) rp.catch(()=>{});
            fadeEl(el, el._targetVol, 600);
          }
        };
        document.addEventListener('click', retry, {once:true});
        document.addEventListener('touchstart', retry, {once:true});
      });
    }
    fadeEl(el, el._targetVol, fadeIn);
  };

  if(el.readyState >= 2) begin();
  else whenReady(el, begin);
}

/* 淡出并暂停某条音轨（保留 currentTime，供日后接着播） */
function pauseEl(el, dur, onEnd){
  el._playing = false;
  cancelAnimationFrame(el._fadeRAF);
  clearInterval(el._fadeTICK);
  const t0 = performance.now(), v0 = el.volume;
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    cancelAnimationFrame(el._fadeRAF);
    clearInterval(el._fadeTICK);
    // 暂停前把音量归零；currentTime 原样保留 → 下次接着播
    el.volume = 0;
    try{ if(!el.paused) el.pause(); }catch(e){}
    if(onEnd) onEnd();
  };
  const step = (now)=>{
    const k = Math.min(1,(now-t0)/dur);
    el.volume = Math.max(0, v0*(1-k));
    if(k >= 1) finish();
  };
  if(dur <= 0){ finish(); return; }
  el._fadeRAF = requestAnimationFrame(function loop(t){
    step(t);
    if(!done) el._fadeRAF = requestAnimationFrame(loop);
  });
  el._fadeTICK = setInterval(()=> step(performance.now()), 50);
}

/* ── 底乐（《特别的人》）的三个操作 ─────────────────────────── */

/* 让底乐开始/继续播放（从暂停处接着播，不回到开头） */
function bgmPlay(fadeIn=1200){
  bgmIntent = 'play';
  startEl(bgm, BGM_VOL, muted ? 0 : fadeIn);
  // 立刻淡出铃声（若正在响）
  if(!bell.paused) pauseEl(bell, 700);
}

/* 让底乐淡出暂停（保留进度） */
function bgmPause(fadeOut=1200){
  bgmIntent = 'pause';
  pauseEl(bgm, fadeOut);
}

/* 按当前意图重新同步底乐状态（窗口可见性变化等场景用） */
function syncBgm(){
  if(!audioUnlocked) return;
  if(bgmIntent === 'play'){
    startEl(bgm, BGM_VOL, 800);
  }
}

/* ── 铃声（《好想爱这个世界啊》）只在来电段 ─────────────────── */
function bellStart(){
  startEl(bell, BELL_VOL, 600);
}
function bellStop(dur=900){
  pauseEl(bell, dur);
}

/* 静音开关 */
$('muteBtn').onclick = (e)=>{
  e.stopPropagation();
  muted = !muted;
  $('muteBtn').classList.toggle('mute', muted);
  cancelAnimationFrame(bgm._fadeRAF); clearInterval(bgm._fadeTICK);
  cancelAnimationFrame(bell._fadeRAF); clearInterval(bell._fadeTICK);
  if(muted){
    bgm._targetVol = 0; bgm.volume = 0;
    bell._targetVol = 0; bell.volume = 0;
  }else{
    bgm._targetVol = BGM_VOL;
    bell._targetVol = BELL_VOL;
    if(!bgm.paused && bgmIntent === 'play') fadeEl(bgm, BGM_VOL, 400);
    if(!bell.paused) fadeEl(bell, BELL_VOL, 400);
  }
};

/* 标签页重新可见时，把底乐状态拉回意图（浏览器可能暂停过它） */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(bgmIntent === 'play' && bgm.paused && audioUnlocked){
    startEl(bgm, BGM_VOL, 600);
  }
});

/* =========================================================
   场景1：雨 + 茉莉（单 canvas 合并绘制）
   雨滴真实打在花瓣上 → 花瓣轻颤 + 水珠沿瓣滑落
   ========================================================= */
function jasmineRain(canvasId){
  const cv = $(canvasId), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let flowers = [];
  let drops = [];
  const splashes = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    const cw = cv.clientWidth || window.innerWidth;
    const ch = cv.clientHeight || window.innerHeight;
    const changed = (Math.abs(cw-W) > 1) || (Math.abs(ch-H) > 1);
    W = cw; H = ch;
    cv.width  = Math.max(1, Math.round(W*DPR));
    cv.height = Math.max(1, Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    // 只有尺寸变化时才重建（避免重复生成导致花跳位置）
    if(changed || flowers.length === 0) buildFlowers();
    if(changed || drops.length === 0) seedDrops();
  }

  /* ---- 茉莉花簇 ---- */
  function buildFlowers(){
    flowers = [];
    if(!W || !H) return;
    const S = Math.min(1.65, Math.max(.88, W/660));
    // 布局策略：左下密集（主枝），右上空（留风的方向）
    // 形成从左上往右下的"斜枝"构图，像窗边探出的一枝
    const spots = [
      // 主枝：左下到中部
      [.06,.92,98],[.18,.86,124],[.30,.94,84],[.42,.82,110],[.55,.91,72],
      // 副枝：左下最密
      [.12,.70,88],[.26,.64,74],[.38,.74,58],
      // 向右渐疏（远景，小、淡）
      [.64,.78,52],[.76,.86,46],[.88,.92,40],
      // 顶部留白（留给文字和月光）
    ];
    for(const [px,py,r] of spots){
      const depth = py;                       // 0~1
      flowers.push({
        x: W*px, y: H*py, r: r*S,
        rot: (Math.random()-.5)*1.6,
        a: 0,
        ta: .78 + depth*.22,
        depth: depth,
        sway: Math.random()*Math.PI*2,
        swaySpd: .0005 + Math.random()*.0007,
        shake: 0,
        shine: 0,
        drops: []
      });
    }
    flowers.sort((a,b)=>a.depth-b.depth);
  }

  /* 画一朵茉莉：5 枚细长莹白花瓣 + 红心 */
  function drawFlower(f, t){
    const {x,y,r} = f;
    const sway = Math.sin(t*f.swaySpd + f.sway) * (.03 + f.shake*.055);
    const sc = 1 + f.shake*.05;
    // 远景降低对比度
    const dim = .78 + f.depth*.22;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(f.rot + sway);
    ctx.scale(sc, sc);
    ctx.globalAlpha = f.a;

    // 外发光（让花瓣在暗底上"浮"起来）
    ctx.save();
    const glow = ctx.createRadialGradient(0,0,0, 0,0, r*1.5);
    glow.addColorStop(0, `rgba(255,255,255,${.16*dim})`);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,r*1.5,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // 花瓣（后层先画，制造层叠；后层稍淡，避免叠加发灰）
    for(let layer=0; layer<2; layer++){
      const isBack = layer === 0;
      for(let i=0;i<5;i++){
        ctx.save();
        ctx.rotate(i*Math.PI*2/5 + (isBack ? Math.PI/5 : 0) + f.shake*.08);
        const sz = isBack ? .84 : 1;
        ctx.beginPath();
        const R = r*1.30*sz, Wd = r*.44*sz;
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo( Wd*.55, -R*.26,  Wd*.86, -R*.80,  0, -R);
        ctx.bezierCurveTo(-Wd*.86, -R*.80, -Wd*.55, -R*.26,  0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, -R);
        if(isBack){
          // 后层：提供轮廓层次
          g.addColorStop(0,   `rgba(255,255,255,${.46*dim+.08})`);
          g.addColorStop(.6,  `rgba(230,235,244,${.34*dim+.06})`);
          g.addColorStop(1,   `rgba(186,194,208,${.20*dim+.04})`);
        }else{
          // 前层：莹白（主视觉，提亮）
          g.addColorStop(0,   `rgba(255,255,255,1)`);
          g.addColorStop(.40, `rgba(255,255,255,${.99*dim+.01})`);
          g.addColorStop(.80, `rgba(240,244,250,${.94*dim+.05})`);
          g.addColorStop(1,   `rgba(190,198,212,${.62*dim+.08})`);
        }
        ctx.fillStyle = g;
        ctx.fill();
        if(!isBack){
          ctx.strokeStyle = `rgba(255,255,255,${(.55+f.shine*.42)*dim})`;
          ctx.lineWidth = .8;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // 花心：红（唯一的红，月光下更跳）
    const cr = r*.245;
    ctx.save();
    // 红心外晕
    const hg = ctx.createRadialGradient(0,0,0, 0,0, cr*3.2);
    hg.addColorStop(0,   `rgba(235,84,68,${.55*dim+.20})`);
    hg.addColorStop(.5,  `rgba(190,42,32,${.28*dim+.10})`);
    hg.addColorStop(1,   'rgba(160,32,26,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0,0,cr*3.2,0,Math.PI*2); ctx.fill();
    // 红心本体（提亮，带呼吸感）
    const breathe = .92 + Math.sin(t*.0012 + f.sway)*.08;   // 0.84~1.0
    const cg = ctx.createRadialGradient(0,0,0, 0,0, cr);
    cg.addColorStop(0,   `rgba(255,128,110,${.98*breathe})`);
    cg.addColorStop(.40, `rgba(216,58,46,${.98*breathe})`);
    cg.addColorStop(.78, `rgba(168,32,26,${.96*breathe})`);
    cg.addColorStop(1,   `rgba(110,20,16,${.88*breathe})`);
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0,0,cr,0,Math.PI*2); ctx.fill();
    // 花蕊（细小白点，带月光）
    for(let i=0;i<7;i++){
      const ang = i*Math.PI*2/7 + t*.0006;
      const rr = cr*(.55 + (i%3)*.20);
      ctx.beginPath();
      ctx.arc(Math.cos(ang)*rr, Math.sin(ang)*rr, 1.0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,248,244,.95)'; ctx.fill();
    }
    ctx.restore();
    ctx.restore();

    // 花瓣上的水珠（世界坐标）
    for(const d of f.drops){
      ctx.beginPath();
      const dg = ctx.createRadialGradient(d.x-1, d.y-1.2, 0, d.x, d.y, d.r*2.1);
      dg.addColorStop(0,'rgba(255,255,255,.92)');
      dg.addColorStop(.42,`rgba(226,232,240,${.5*d.a})`);
      dg.addColorStop(1,'rgba(200,206,216,0)');
      ctx.fillStyle = dg;
      ctx.arc(d.x, d.y, d.r*2.1, 0, Math.PI*2);
      ctx.fill();
    }
  }

  /* ---- 雨滴 ---- */
  const DROP_TARGET = 190;

  function newDrop(init){
    return {
      x: Math.random()*(Math.max(W,1)*1.08),
      y: init ? Math.random()*Math.max(H,1) : -20 - Math.random()*140,
      len: 10 + Math.random()*22,
      sp: 2.6 + Math.random()*5.6,
      a: .16 + Math.random()*.34,
      w: Math.random()<.16 ? 1.5 : .95,
      big: Math.random() < .14
    };
  }
  function seedDrops(){
    if(!W || !H) return;
    drops = [];
    for(let i=0;i<DROP_TARGET;i++) drops.push(newDrop(true));
  }

  /* ---- 溅落涟漪 ---- */

  let t = 0;
  let running = false;

  /* 纯绘制一帧（可被同步调用） */
  function drawFrame(){
    if(!W || !H) return;
    ctx.clearRect(0,0,W,H);

    // 深色底（黑灰渐变，留出茉莉的呼吸感）
    const bg = ctx.createRadialGradient(W*.5, H*.42, 0, W*.5, H*.42, Math.max(W,H)*.8);
    bg.addColorStop(0,'rgba(28,30,35,1)');
    bg.addColorStop(.55,'rgba(16,17,20,1)');
    bg.addColorStop(1,'rgba(7,7,9,1)');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    // 月光：左上很淡的冷光晕，让"月光下茉莉"成立
    const moon = ctx.createRadialGradient(W*.18, H*.12, 0, W*.18, H*.12, Math.max(W,H)*.55);
    moon.addColorStop(0,   'rgba(200,214,235,.18)');
    moon.addColorStop(.4,  'rgba(180,198,228,.08)');
    moon.addColorStop(1,   'rgba(150,170,210,0)');
    ctx.fillStyle = moon; ctx.fillRect(0,0,W,H);

    t += 16;

    // 先画花（在雨之后面）
    for(const f of flowers){
      f.a += (f.ta - f.a) * .022;
      f.shake *= .93;
      f.shine *= .9;
      for(let i=f.drops.length-1;i>=0;i--){
        const d = f.drops[i];
        d.y += d.vy; d.vy += .012; d.a -= .004;
        if(d.y > f.y + f.r*.9 || d.a <= 0) f.drops.splice(i,1);
      }
      drawFlower(f, t);
    }

    // 再画雨丝（在花之前面）
    for(const d of drops){
      ctx.beginPath();
      ctx.strokeStyle = `rgba(214,219,228,${d.a})`;
      ctx.lineWidth = d.w;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1.15, d.y + d.len);
      ctx.stroke();

      d.y += d.sp; d.x -= .72;

      // 命中花瓣检测
      if(d.big){
        for(const f of flowers){
          const dx = d.x - f.x, dy = d.y - f.y;
          const rr = f.r * 1.12;
          if(dx*dx + dy*dy < rr*rr){
            f.shake = Math.min(1.6, f.shake + .95);
            f.shine = 1;
            const ang = Math.atan2(dy, dx);
            f.drops.push({
              x: f.x + Math.cos(ang)*f.r*.55,
              y: f.y + Math.sin(ang)*f.r*.55,
              r: 1.5 + Math.random()*1.5,
              vy: .28 + Math.random()*.34,
              a: .85
            });
            splashes.push({x:d.x, y:d.y, r:0, a:.42, red:true});
            d.y = H + 999;
            break;
          }
        }
      }

      if(d.y > H){
        if(Math.random() < .16) splashes.push({x:d.x, y:H-3, r:0, a:.22, red:false});
        Object.assign(d, newDrop(false));
      }
      if(d.x < -30) d.x = W + Math.random()*50;
    }

    // 涟漪
    for(let i=splashes.length-1;i>=0;i--){
      const s = splashes[i];
      ctx.beginPath();
      ctx.strokeStyle = s.red
        ? `rgba(200,50,43,${s.a*.5})`
        : `rgba(180,186,198,${s.a*.5})`;
      ctx.lineWidth = .8;
      ctx.ellipse(s.x, s.y, s.r, s.r*.3, 0, 0, Math.PI*2);
      ctx.stroke();
      s.r += .5; s.a -= .026;
      if(s.a <= 0) splashes.splice(i,1);
    }
  }

  function loop(){
    if(!running) return;
    if(!W || !H){
      // 尺寸尚未就绪（场景刚切换）→ 重测
      if(cv.clientWidth > 0 || window.innerWidth > 0) resize();
      requestAnimationFrame(loop);
      return;
    }
    drawFrame();
    requestAnimationFrame(loop);
  }

  resize();
  addEventListener('resize', ()=>{ setTimeout(resize, 60); });
  let started = false;
  return {
    start(){
      if(started) return;
      started = true; running = true;
      resize();
      drawFrame();
      loop();               // loop 内部会处理尺寸未就绪的情况
      setTimeout(()=>{ resize(); drawFrame(); }, 150);
      setTimeout(()=>{ resize(); drawFrame(); }, 600);
      setTimeout(()=>{ resize(); drawFrame(); }, 1400);
    },
    resize,
    drawFrame
  };
}
let jr = null;

function onEnter(i){
  switch(i){
    case 0:
      // 黑场雨 —— 底乐从这一刻就开始（用户点"进入"时已解锁），
      // 让它安静地铺在雨声下面，不做任何暂停。
      bgmPlay(1800);
      break;

    case 1:
      // 茉莉雨 —— 底乐继续（本来就在放，不重置、不跳进度）
      bgmPlay(1800);
      if(!jr) jr = jasmineRain('cv1');
      requestAnimationFrame(()=> requestAnimationFrame(()=> jr.start()));
      setTimeout(()=> jr.resize(), 400);
      break;

    case 2:
      // 来电 —— 唯一停底乐的时刻之一，改放《好想爱这个世界啊》铃声
      bgmPause(1200);
      bellStart();
      runCallSequence();
      break;

    case 3:
      // 色彩 —— 铃声收起，底乐从暂停处接着播
      bellStop(700);
      bgmPlay(1800);
      break;

    case 4:
      // 信 —— 底乐继续
      bgmPlay(1400);
      buildLetter();
      break;

    case 5:
      // 蛋糕 —— 进幕时底乐照常放着（许愿时也有音乐），
      // 真正暂停的时刻是「吹蜡烛」——在 doBlow() 里处理。
      bgmPlay(1600);
      startCake();
      break;
  }
}

/* ---------- 来电序列 ---------- */
let callTimerInt = null;
function runCallSequence(){
  const st = $('callStatus');
  const avHer = $('avHer');
  const link = $('callLink');
  const timer = $('callTimer');
  st.textContent = '正在拨打…';
  st.classList.add('wait');
  st.classList.remove('connected');
  avHer.classList.add('ring');
  link.classList.remove('on');
  timer.classList.remove('on');
  timer.textContent = '00:00';
  clearTimeout(runCallSequence._t1);
  clearTimeout(runCallSequence._t2);
  clearInterval(callTimerInt);
  runCallSequence._t1 = setTimeout(()=>{
    st.textContent = '等待对方接听…';
  }, 1700);
  runCallSequence._t2 = setTimeout(()=>{
    st.textContent = '已接通';
    st.classList.remove('wait');
    st.classList.add('connected');
    avHer.classList.remove('ring');
    link.classList.add('on');
    // 计时开始
    let sec = 0;
    const fmt = n => String(n).padStart(2,'0');
    timer.textContent = '00:00';
    timer.classList.add('on');
    callTimerInt = setInterval(()=>{
      sec++;
      timer.textContent = `${fmt(Math.floor(sec/60))}:${fmt(sec%60)}`;
    }, 1000);
  }, 3800);
}

/* ---------- 信逐段浮现 ---------- */
function buildLetter(){
  const box = $('letter');
  if(box.dataset.built) { revealAll(); return; }
  box.dataset.built = '1';
  box.innerHTML = '';
  letterData.forEach((txt,i)=>{
    const p = document.createElement('p');
    if(i===0) p.className = 'first';
    if(i===letterData.length-1){
      p.className = 'sig';
      p.innerHTML = '——<span class="nm">瑞❄️</span>';
    } else {
      p.textContent = txt;
    }
    box.appendChild(p);
  });
  // 印章
  const mk = document.createElement('div');
  mk.className = 'sign-mark';
  mk.innerHTML = '<div class="seal" id="sealEl"><span>瑞</span><span>❄️</span></div>';
  box.appendChild(mk);
  revealAll();
}
function revealAll(){
  const ps = [...$('letter').querySelectorAll('p')];
  const seal = $('sealEl');
  ps.forEach((p,i)=> setTimeout(()=> p.classList.add('show'), 260 + i*420));
  setTimeout(()=> seal && seal.classList.add('show'), 260 + ps.length*420 + 500);
}

/* =========================================================
   场景5：蛋糕 + 麦克风吹气
   ========================================================= */
let cakeInited = false;
function startCake(){
  const flame = $('flame'), halo = $('halo'), smoke = $('smoke');
  const ageGlow = $('ageGlow'), ageSmoke = $('ageSmoke');
  flame.classList.remove('gone');
  halo.classList.remove('gone');
  smoke.classList.remove('go');
  if(ageGlow){ ageGlow.classList.remove('gone'); ageGlow.classList.add('on'); }
  if(ageSmoke){ ageSmoke.classList.remove('on'); }
  $('wish').classList.remove('on');
  const cw = document.querySelector('.cake-wrap');
  if(cw) cw.classList.remove('fadeout');
  $('blowT1').textContent = '对着屏幕，轻轻吹一口气';
  $('blowT2').textContent = '许个愿，然后吹灭它';
  $('breathFill').style.width = '0%';
  [...$('ripples').children].forEach(el=>{ el.style.height='5px'; el.style.opacity='.35'; });
  if(cakeInited) { listenMic(); return; }
  cakeInited = true;
  spawnFloatAvatars();
  listenMic();
}

/* --- 麦克风 --- */
let micStream=null, audioCtx=null, analyser=null, micRAF=null, blowHold=0, blown=false;
let micFallbackTimer=null;

async function listenMic(){
  blown = false; blowHold = 0;
  clearTimeout(micFallbackTimer);
  // 设备不支持
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return fallbackBlow();
  }
  try{
    if(!micStream){
      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
      });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024; analyser.smoothingTimeConstant = .72;
      src.connect(analyser);
    }
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    $('blowT2').textContent = '（已开启，等你吹气）';
    micLoop();
    // 兜底：18 秒还没吹灭，温柔提示可以点一下
    micFallbackTimer = setTimeout(()=>{
      if(!blown && cur===5){
        $('blowT2').innerHTML = '（吹不动的话，<span style="color:var(--red-soft)">点一下火苗</span>也可以）';
      }
    }, 18000);
  }catch(e){
    fallbackBlow();
  }
}

/* 降级：5 秒动画自动吹灭 */
function fallbackBlow(){
  $('blowT1').textContent = '许个愿吧';
  $('blowT2').textContent = '五秒后，替你吹灭';
  try{ ripplesSim(); }catch(e){}
  clearTimeout(micFallbackTimer);
  micFallbackTimer = setTimeout(()=>{ if(!blown) doBlow(); }, 5000);
}

function micLoop(){
  const buf = new Uint8Array(analyser.fftSize);
  const fill = $('breathFill');
  const rip = [...$('ripples').children];
  let last = performance.now();
  cancelAnimationFrame(micRAF);
  // 阈值：正常吹气约 0.06，轻吹约 0.033 → 取 0.035，宁可灵敏
  const THRESHOLD = 0.035;
  const HOLD_MS = 900;      // 持续吹气这么久就吹灭

  function tick(now){
    if(blown || cur !== 5) return;
    const dt = Math.min(80, now - last); last = now;
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum += v*v; }
    const rms = Math.sqrt(sum/buf.length);

    const level = Math.min(1, rms/0.14);
    rip.forEach((el,i)=>{
      const k = Math.abs(Math.sin(now*.006 + i*.7)) * level;
      el.style.height = (4 + k*22) + 'px';
      el.style.opacity = (.25 + k*.75).toFixed(2);
    });

    if(rms > THRESHOLD){
      blowHold += dt;
      if(blowHold > HOLD_MS){ doBlow(); return; }
    } else {
      blowHold = Math.max(0, blowHold - dt*1.6);
    }
    fill.style.width = Math.min(100, blowHold/HOLD_MS*100) + '%';
    micRAF = requestAnimationFrame(tick);
  }
  micRAF = requestAnimationFrame(tick);
}

function ripplesSim(){
  const rip = [...$('ripples').children];
  const fill = $('breathFill');
  const t0 = performance.now();
  (function tick(now){
    const k = (now-t0)/5000;
    if(k>1 || blown) return;
    rip.forEach((el,i)=>{
      const v = Math.abs(Math.sin(now*.004 + i*.6)) * (1-k);
      el.style.height = (4 + v*20)+'px';
      el.style.opacity = (.2+v*.7).toFixed(2);
    });
    fill.style.width = (k*100)+'%';
    requestAnimationFrame(tick);
  })(t0);
}

function doBlow(){
  if(blown) return;
  blown = true;
  cancelAnimationFrame(micRAF);
  $('flame').classList.add('gone');
  $('halo').classList.add('gone');
  // 火焰上方的"19"同时退去
  const ageGlow = $('ageGlow');
  if(ageGlow){ ageGlow.classList.remove('on'); ageGlow.classList.add('gone'); }
  setTimeout(()=> $('smoke').classList.add('go'), 260);
  // 烟雾聚成"19"
  setTimeout(()=>{
    const ageSmoke = $('ageSmoke');
    if(ageSmoke) ageSmoke.classList.add('on');
  }, 700);
  $('blowT1').textContent = '';
  $('blowT2').textContent = '';
  // 波纹归零
  [...$('ripples').children].forEach(el=>{ el.style.height='3px'; el.style.opacity='.15'; });
  $('breathFill').style.width = '100%';
  // 这一刻暂停底乐 —— 蜡烛吹灭的瞬间要安静，让许愿被听见
  bgmPause(900);
  // 祝福词
  setTimeout(()=> $('wish').classList.add('on'), 1300);
  // 祝福词占据主视觉 → 蛋糕淡出，避免叠加
  setTimeout(()=>{
    const cw = document.querySelector('.cake-wrap');
    if(cw) cw.classList.add('fadeout');
  }, 1500);
  // 许愿结束、祝福词浮出后，底乐**从刚才暂停的地方接着播**（不回到开头）
  setTimeout(()=>{ bgmPlay(2200); }, 2400);
}

/* ---------- 头像飘浮 ---------- */
function spawnFloatAvatars(){
  const s5 = $('s5');
  // 优先 webp（更小），失败自动回退
  const meSrc = 'assets/img/me_400.webp', meFall = 'assets/img/me_400.jpg';
  const herSrc = 'assets/img/her_400.webp', herFall = 'assets/img/her_400.png';
  const defs = [
    {src:meSrc,  fall:meFall,  x:'7%',  y:'20%', d:44},
    {src:herSrc, fall:herFall, x:'80%', y:'15%', d:52},
    {src:herSrc, fall:herFall, x:'9%',  y:'66%', d:46},
    {src:meSrc,  fall:meFall,  x:'82%', y:'70%', d:38}
  ];
  defs.forEach((d,i)=>{
    const im = document.createElement('img');
    im.className = 'float-av'; im.alt='';
    im.onerror = function(){ this.onerror = null; this.src = d.fall; };
    im.src = d.src;
    im.style.cssText = `width:${d.d}px;height:${d.d}px;left:${d.x};top:${d.y};`;
    s5.appendChild(im);
    setTimeout(()=>{
      im.style.opacity = '.22';
      im.style.transition = 'opacity 2.4s ease, transform 6s ease';
      im.style.transform = `translateY(${-14-Math.random()*8}px)`;
    }, 700+i*380);
  });
}

$('againBtn').onclick = ()=>{
  $('wish').classList.remove('on');
  // 蛋糕重新浮现
  const cw = document.querySelector('.cake-wrap');
  if(cw) cw.classList.remove('fadeout');
  // 底乐确保在放（首次吹灭后已恢复，这里只做兜底，不重置进度）
  setTimeout(()=>{ bgmPlay(1400); startCake(); }, 700);
};

/* 点火苗 / 点蜡烛 也能吹灭（兜底，防止麦克风不灵） */
['flame','cakeSvg'].forEach(id=>{
  const el = $(id);
  if(el) el.addEventListener('click', ev=>{

const stage = $('stage');
let lastTap = 0;
stage.addEventListener('click', e=>{
  if(cur<0) return;
  if(cur===4) return;            // 信场景：自己滚动
  if(cur===5) return;            // 蛋糕：按钮控制
  if(e.target.closest('#hud, .ic')) return;
  const now = Date.now();
  if(now - lastTap < 260) return; // 防连点
  lastTap = now;
  nextScene();
});
$('skip').onclick = e=>{ e.stopPropagation(); go(3); };
$('next').onclick = e=>{ e.stopPropagation(); nextScene(); };

// 键盘
addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' ','Enter'].includes(e.key)){ e.preventDefault(); nextScene(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
});

/* 场景0 → 1：等点击后启动，但先自动播一个滴水动画 */
function bootRain0(){
  const cv = $('cv0'), ctx = cv.getContext('2d');
  let W=0,H=0,DPR=1, ds=[];
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ds = [];
    for(let i=0;i<26;i++) ds.push({
      x:Math.random()*W, y:Math.random()*H,
      l:8+Math.random()*14, s:3+Math.random()*4, a:.06+Math.random()*.14
    });
  }
  resize();
  addEventListener('resize', ()=>setTimeout(resize,60));
  function draw(){
    if(!W || !H) return;
    ctx.clearRect(0,0,W,H);
    for(const d of ds){
      ctx.beginPath(); ctx.strokeStyle=`rgba(200,204,212,${d.a})`; ctx.lineWidth=.8;
      ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-.6,d.y+d.l); ctx.stroke();
      d.y+=d.s;
      if(d.y>H){ d.y=-20; d.x=Math.random()*W; }
    }
  }
  (function loop(){
    if(!W || !H){ if(cv.clientWidth>0) resize(); requestAnimationFrame(loop); return; }
    draw();
    requestAnimationFrame(loop);
  })();
  setTimeout(()=>{ resize(); draw(); }, 120);
  setTimeout(()=>{ resize(); draw(); }, 500);

  // 开场诗：涟漪起手(≈1.15s) 之后让诗浮现
  setTimeout(()=>{ $('s0').classList.add('poem-on'); }, 1150);
}

/* 启动：进入第一幕（黑场雨），之后由点击推进 */
function startAll(){
  go(0);
  bootRain0();
}
/* 场景0 内部的自动推进（仅当用户一直没点）：12 秒后温柔提示 */
let s0Timer = null;
function armS0Auto(){
  clearTimeout(s0Timer);
  s0Timer = setTimeout(()=>{
    if(cur===0) go(1);
  }, 12000);
}

/* ---------- gate ---------- */
$('gateBtn').onclick = ()=>{
  // 关键：解锁必须在同步栈里，不能放在 await 之后
  unlockAudio();
  $('gate').classList.add('off');
  startAll();
  armS0Auto();
};
// 兜底：整页任意首次触摸也解锁一次
['pointerdown','touchstart','keydown'].forEach(ev=>{
  addEventListener(ev, ()=>unlockAudio(), {once:true, passive:true});
});

/* ---------- 调试/截图直跳（?shot=N 或 #shot=N） ----------
   仅用于开发拍照：跳过 gate、直接进对应幕。
   正常访问没有 query/hash，不会触发。 */
(function(){
  const m = (location.search + location.hash).match(/shot=(\d)/);
  if(!m) return;
  const i = parseInt(m[1], 10);
  if(isNaN(i) || i < 0 || i > 5) return;
  // 直接绕过 gate
  document.getElementById('gate').classList.add('off');
  go(i);
  if(i===0) bootRain0();
  // 信幕：立即显示所有段落（便于截图）
  if(i===4){
    setTimeout(()=>{
      const box = $('letter');
      // 强制立刻显示
      box.style.transition = 'none';
      box.style.opacity = '1';
      box.style.transform = 'none';
      [...box.querySelectorAll('p')].forEach(p=>{
        p.style.transition = 'none';
        p.classList.add('show');
      });
      const seal = $('sealEl');
      if(seal){ seal.style.transition = 'none'; seal.classList.add('show'); }
    }, 300);
  }
  // 蛋糕幕：为拍照先直接吹灭并显示祝福（加 noBlow 可跳过）
  if(i===5 && !/noBlow/.test(location.search + location.hash)){
    setTimeout(()=>{ if(!blown) doBlow(); }, 900);
  }
  // 单独看祝福词排版：加 wish 参数立刻显示（跳过动画）
  if(/[?&#]wish/.test(location.search + location.hash)){
    setTimeout(()=>{
      const w = $('wish');
      w.style.transition = 'none';
      w.classList.add('on');
      const cw = document.querySelector('.cake-wrap');
      if(cw){ cw.style.transition = 'none'; cw.classList.add('fadeout'); }
    }, 400);
  }
})();
